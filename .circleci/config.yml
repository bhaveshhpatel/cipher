# .circleci/config.yml
# Backend: lint + regression (92% coverage gate) + deploy to Railway
# Frontend: npm install + next build (type gate) + jest --ci --coverage + deploy to Vercel
# Vercel git integration should be disabled in Project Settings → Git
# so only this pipeline can trigger production deploys.

version: 2.1

# -----------------------------------------------------------------------
# Reusable commands
# -----------------------------------------------------------------------
commands:
  install_deps:
    description: Install Python dependencies with pip cache
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
            - pip-v1-
      - run:
          name: Install all dependencies
          working_directory: ~/project/backend
          command: |
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
      - save_cache:
          key: pip-v1-{{ checksum "backend/requirements.txt" }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

# -----------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------
jobs:

  # -----------------------------------------------------------------------
  # Job 1: Syntax check — pyflakes only, no heavy deps
  # -----------------------------------------------------------------------
  lint:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Install pyflakes
          command: pip install pyflakes
      - run:
          name: Syntax check
          working_directory: ~/project/backend
          command: |
            python -m pyflakes .
            echo "All Python files OK"

  # -----------------------------------------------------------------------
  # Job 2: Regression tests + 92% coverage gate
  # -----------------------------------------------------------------------
  regression:
    docker:
      - image: cimg/python:3.11.9
    environment:
      SUPABASE_URL:              https://dummy.supabase.co
      SUPABASE_KEY:              dummy-supabase-key
      SUPABASE_SERVICE_KEY:      dummy-service-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      JWT_SECRET:                ci-test-jwt-secret-not-used-in-prod
      SECRET_KEY:                ci-test-secret-key
      TRADIER_API_KEY:           dummy-tradier-key
      TRADIER_ACCOUNT_ID:        VA00000000
      TRADIER_BASE_URL:          https://sandbox.tradier.com
      GROQ_API_KEY:              ""
      ALLOWED_ORIGINS:           http://localhost:3000,http://testserver,http://test
      ENVIRONMENT:               test
    steps:
      - checkout
      - install_deps
      - run:
          name: Purge stale bytecode cache
          working_directory: ~/project/backend
          command: |
            find . -type f -name '*.pyc' -delete
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            echo "Bytecode cache purged"
      - run:
          name: Run regression suite with coverage
          working_directory: ~/project/backend
          command: |
            pytest \
              --tb=short \
              -q \
              --continue-on-collection-errors \
              --cov=. \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-report=json:coverage.json \
              --cov-fail-under=92 \
              --cov-config=.coveragerc
      - store_artifacts:
          path: ~/project/backend/coverage.xml
          destination: coverage.xml
      - store_artifacts:
          path: ~/project/backend/coverage.json
          destination: coverage.json

  # -----------------------------------------------------------------------
  # Job 3: Frontend — type-check + Jest coverage gate
  # No package-lock.json in repo — uses npm install, cache keyed on package.json.
  # -----------------------------------------------------------------------
  frontend_test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-v1-{{ checksum "frontend/package.json" }}
            - node-v1-
      - run:
          name: Install frontend dependencies
          working_directory: ~/project/frontend
          command: npm install --prefer-offline
      - save_cache:
          key: node-v1-{{ checksum "frontend/package.json" }}
          paths:
            - ~/.npm
      - run:
          name: Type-check
          working_directory: ~/project/frontend
          command: npx tsc --noEmit
      - run:
          name: Next.js build
          working_directory: ~/project/frontend
          command: npm run build
      - run:
          name: Jest — CI mode with coverage
          working_directory: ~/project/frontend
          command: npm run test:ci
      - store_artifacts:
          path: ~/project/frontend/coverage
          destination: frontend-coverage

  # -----------------------------------------------------------------------
  # Job 4: Deploy backend to Railway (main only, after lint + regression)
  # -----------------------------------------------------------------------
  deploy_backend:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          command: sudo npm install -g @railway/cli
      - run:
          name: Deploy backend to Railway
          command: railway up --service cipher
          # RAILWAY_TOKEN must be set in CircleCI Project Settings → Environment Variables

  # -----------------------------------------------------------------------
  # Job 5: Deploy frontend to Vercel (main only, after frontend_test passes)
  # Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in CircleCI env vars.
  # Vercel git integration must be disabled so only this job triggers prod deploys.
  # -----------------------------------------------------------------------
  deploy_frontend:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: sudo npm install -g vercel
      - run:
          name: Pull Vercel project settings + env
          working_directory: ~/project
          command: |
            vercel pull \
              --yes \
              --environment=production \
              --token=$VERCEL_TOKEN
      - run:
          name: Build project via Vercel
          working_directory: ~/project
          command: |
            vercel build \
              --prod \
              --token=$VERCEL_TOKEN
      - run:
          name: Deploy prebuilt output to Vercel production
          working_directory: ~/project
          command: |
            vercel deploy \
              --prebuilt \
              --prod \
              --token=$VERCEL_TOKEN

# -----------------------------------------------------------------------
# Workflows
# -----------------------------------------------------------------------
workflows:
  ci_cd:
    jobs:

      # ── Backend jobs ────────────────────────────────────────────────
      - lint:
          filters:
            branches:
              only:
                - main
                - /refactor\/.*/
                - /feature\/.*/
                - /fix\/.*/

      - regression:
          filters:
            branches:
              only:
                - main
                - /refactor\/.*/
                - /feature\/.*/
                - /fix\/.*/

      - deploy_backend:
          requires:
            - lint
            - regression
          filters:
            branches:
              only: main

      # ── Frontend jobs ───────────────────────────────────────────────
      - frontend_test:
          filters:
            branches:
              only:
                - main
                - /refactor\/.*/
                - /feature\/.*/
                - /fix\/.*/

      - deploy_frontend:
          requires:
            - frontend_test
          filters:
            branches:
              only: main
