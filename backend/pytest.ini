[pytest]
# ---------------------------------------------------------------------------
# Cipher Backend — pytest configuration
# Phase 5 final: Coverage gate at 92%, branch coverage enabled, fail-fast on.
# ---------------------------------------------------------------------------

# Test discovery
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# asyncio mode — all async tests run without explicit @pytest.mark.asyncio
asyncio_mode = auto

# Coverage options.
# --cov-branch:      measure branch coverage (if/else arcs), not just line hits.
# -x:               fail fast — stop at first failure to surface errors quickly.
# --cov-fail-under:  hard gate; CI fails if total drops below this.
# HTML report omitted from addopts — too slow for CI; generate locally with:
#   pytest --cov-report=html:coverage_html
addopts =
    -x
    --tb=short
    --strict-markers
    -q
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=92
    --cov-config=.coveragerc

# Custom markers used across the test suite.
# Any marker not declared here will cause --strict-markers to error.
markers =
    regression:   marks tests as regression tests (run on every PR)
    integration:  marks tests that require live external services (skip in CI)
    slow:         marks tests that take >2s
