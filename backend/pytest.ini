[pytest]
# ---------------------------------------------------------------------------
# Cipher Backend — pytest configuration
# Phase 5: Coverage gate enforced at 90% minimum (road to 100%)
# ---------------------------------------------------------------------------

# Test discovery
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

# asyncio mode for all async tests
asyncio_mode = auto

# Coverage — measured over the full backend source tree
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=.
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
    --cov-config=.coveragerc

# Custom markers used across the test suite
markers =
    regression: marks tests as regression tests (run on every PR)
    integration: marks tests that require live external services (skip in CI)
    slow: marks tests that take >2s
