[pytest]
# ---------------------------------------------------------------------------
# Cipher Backend — pytest configuration
# Phase 5 final: Coverage gate enforced in .coveragerc [report] fail_under=90
# so it only triggers on full-suite CI runs, not per-file dev iterations.
# ---------------------------------------------------------------------------

# Test discovery
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# asyncio mode — all async tests run without explicit @pytest.mark.asyncio
asyncio_mode = auto

# Coverage options.
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-config=.coveragerc

# Custom markers used across the test suite.
markers =
    regression:   marks tests as regression tests (run on every PR)
    integration:  marks tests that require live external services (skip in CI)
    slow:         marks tests that take >2s
    benchmark:    marks latency/throughput benchmark tests (skipped in standard CI; run explicitly with -m benchmark)

# ---------------------------------------------------------------------------
# QA-03: filterwarnings
#
# 'benchmark' is declared above so --strict-markers accepts it when
# REARCH-012 benchmark tests land.  Until then, some pytest versions emit
# PytestUnknownMarkWarning at collection time for declared-but-unused markers.
# The ignore rule below suppresses that specific collection-time noise without
# removing the declaration (which would break --strict-markers enforcement).
#
# The second rule promotes all other unrecognised mark warnings to errors so
# any genuinely typo'd marker is caught immediately.
# ---------------------------------------------------------------------------
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning:_pytest
    error::pytest.PytestUnknownMarkWarning
