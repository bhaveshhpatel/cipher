[pytest]
# ---------------------------------------------------------------------------
# Cipher Backend — pytest configuration
# Phase 5: Coverage gate enforced at 90% minimum (road to 100%)
# ---------------------------------------------------------------------------

# Test discovery
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

# asyncio mode for all async tests
asyncio_mode = auto

# Coverage — measured over explicit source packages only (see .coveragerc).
# HTML report omitted from addopts — too slow for CI, generate locally with:
#   pytest --cov-report=html:coverage_html
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
    --cov-config=.coveragerc

# Custom markers used across the test suite
markers =
    regression: marks tests as regression tests (run on every PR)
    integration: marks tests that require live external services (skip in CI)
    slow: marks tests that take >2s
