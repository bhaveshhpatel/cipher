[pytest]
# ---------------------------------------------------------------------------
# Cipher Backend — pytest configuration
# Phase 5 final: Coverage gate at 92%, branch coverage enabled.
# NOTE: -x (fail-fast) intentionally removed — CI must surface ALL failures
#       in one run so every broken test is visible at once.
# ---------------------------------------------------------------------------

# Test discovery
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# asyncio mode — all async tests run without explicit @pytest.mark.asyncio
asyncio_mode = auto

# Coverage options.
# --cov-branch:      measure branch coverage (if/else arcs), not just line hits.
# --cov-fail-under:  hard gate; CI fails if total drops below this.
# HTML report omitted from addopts — too slow for CI; generate locally with:
#   pytest --cov-report=html:coverage_html
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=92

# Custom markers used across the test suite.
# Any marker not declared here will cause --strict-markers to error.
markers =
    regression:   marks tests as regression tests (run on every PR)
    integration:  marks tests that require live external services (skip in CI)
    slow:         marks tests that take >2s

# ---------------------------------------------------------------------------
# Coverage configuration (pytest-cov reads [coverage:*] sections from pytest.ini
# when --cov-config is not passed, taking precedence over .coveragerc).
# Omit list uses absolute-path-safe patterns: leading path component is the
# directory pytest runs from (backend/), so paths are bare relative names.
# ---------------------------------------------------------------------------
[coverage:run]
branch = true
source = .
omit =
    tests/*
    tests/integration/*
    */__pycache__/*
    # Infrastructure I/O — no unit-testable logic without live sockets/DB.
    services/tradier_stream.py
    services/stream_worker.py
    services/stream_manager.py
    services/flow_store.py
    services/ingestion_config.py
    ingestion/config.py
    utils/contract_day_cache.py
    # App startup wiring.
    main.py
    # Router handlers tested via HTTP integration fixtures.
    routers/auth.py
    routers/flow.py
    routers/history.py
    routers/smart_signals.py
    # Stub module with no callers yet.
    signals/ladder_detector.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod
    pass

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
