# Render IaC — Cipher Backend
# https://render.com/docs/infrastructure-as-code
#
# This file defines the Render service for the Cipher backend.
# Environment variables (SUPABASE_URL, SUPABASE_KEY, etc.) must be
# set manually in the Render dashboard under the service's Environment tab.
# They are NOT stored here to keep secrets out of source control.

services:
  - type: web
    name: cipher-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: false  # Deploys are triggered via GitHub Actions deploy hook on push to main
