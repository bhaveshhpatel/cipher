# =============================================================================
# Cipher — Unified Regression Gate
# =============================================================================
# DISABLED — all automatic triggers removed. Restore on:/pull_request block
# to re-enable. Jobs and steps are fully preserved.
# =============================================================================
name: Regression Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Backend — pytest + coverage >= 92% + branch coverage
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Regression Gate
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:              "https://dummy.supabase.co"
      SUPABASE_KEY:              "dummy-supabase-key"
      SUPABASE_SERVICE_KEY:      "dummy-service-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      JWT_SECRET:                "ci-test-jwt-secret-not-used-in-prod"
      SECRET_KEY:                "ci-test-secret-key"
      TRADIER_API_KEY:           "dummy-tradier-key"
      TRADIER_ACCOUNT_ID:        "VA00000000"
      TRADIER_BASE_URL:          "https://sandbox.tradier.com"
      GROQ_API_KEY:              ""
      ALLOWED_ORIGINS:           "http://localhost:3000,http://testserver,http://test"
      ENVIRONMENT:               "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check (pyflakes)
        working-directory: backend
        run: |
          pip install pyflakes
          python -m pyflakes .
          echo "Syntax check passed"

      - name: Purge bytecode cache
        working-directory: backend
        run: |
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

      - name: Run regression suite
        working-directory: backend
        run: |
          pytest \
            -x \
            --tb=short \
            -q \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=92 \
            --cov-config=.coveragerc

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-gate
          path: |
            backend/coverage.xml
            backend/coverage.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Frontend — type-check then Jest + coverageThreshold enforced in jest.config.ts
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Regression Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests with coverage
        run: npx jest --ci --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-gate
          path: frontend/coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate — depends on both jobs. Add THIS as the required status check.
  # ---------------------------------------------------------------------------
  gate:
    name: All Regression Gates Passed
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend status : ${{ needs.backend.result }}"
          echo "Frontend status: ${{ needs.frontend.result }}"
          if [[ "${{ needs.backend.result }}"  != "success" || \
                "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more regression gates FAILED or were SKIPPED. Merge is blocked."
            exit 1
          fi
          echo "All regression gates passed. Safe to merge."
