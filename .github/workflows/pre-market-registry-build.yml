name: Pre-Market Registry Build

# DISABLED — schedule removed. Restore on:/schedule block to re-enable.
# workflow_dispatch retained for manual testing.
on:
  workflow_dispatch:

jobs:
  trigger-registry-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger registry build on Railway
        run: |
          curl -X POST "${{ secrets.RAILWAY_ADMIN_URL }}/admin/rebuild-universe" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            --fail \
            --retry 3 \
            --retry-delay 10
      - name: Log result
        if: always()
        run: echo "Registry build trigger completed at $(date -u)"
