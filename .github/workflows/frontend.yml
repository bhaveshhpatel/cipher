name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"   # backend changes also trigger Vercel redeploy
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Type check + lint
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache omitted — no package-lock.json in repo

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Job 2: Regression tests + Jest coverage gate
  # ---------------------------------------------------------------------------
  regression:
    name: Frontend Regression Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache omitted — no package-lock.json in repo

      - name: Install dependencies
        run: npm install

      - name: Run regression tests with coverage
        # --ci:       fail on snapshot updates (no interactive mode)
        # --coverage: enforce jest.config.ts coverageThreshold
        # NOTE: --passWithNoTests removed intentionally — zero tests = CI fail
        run: npx jest --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3: Build (validates the Next.js build compiles cleanly)
  # Deploy is handled automatically by Vercel's GitHub integration on push to main.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: regression
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL:  ${{ secrets.NEXT_PUBLIC_WS_URL }}
