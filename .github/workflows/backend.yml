name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "railway.toml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "railway.toml"

permissions:
  contents: read
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Syntax check — pyflakes only, NO pip install of heavy deps
  # -------------------------------------------------------------------------
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes only
        run: pip install pyflakes

      - name: Syntax check
        working-directory: backend
        run: |
          python -m pyflakes .
          echo "All Python files OK"

  # -------------------------------------------------------------------------
  # Job 2: Regression test suite with coverage gate
  # Real gate: --cov-fail-under=92 in pytest.
  # orgoro/coverage is informational (continue-on-error: true).
  # -------------------------------------------------------------------------
  regression:
    name: Regression Tests + Coverage Gate
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:         "https://dummy.supabase.co"
      SUPABASE_KEY:         "dummy-supabase-key"
      SUPABASE_SERVICE_KEY: "dummy-service-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      JWT_SECRET:           "ci-test-jwt-secret-not-used-in-prod"
      SECRET_KEY:           "ci-test-secret-key"
      TRADIER_API_KEY:      "dummy-tradier-key"
      TRADIER_ACCOUNT_ID:   "VA00000000"
      TRADIER_BASE_URL:     "https://sandbox.tradier.com"
      GROQ_API_KEY:         ""
      ALLOWED_ORIGINS:      "http://localhost:3000,http://testserver,http://test"
      ENVIRONMENT:          "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install all dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Purge stale Python bytecode cache
        working-directory: backend
        run: |
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          echo "Bytecode cache purged"

      - name: Run regression suite with coverage
        working-directory: backend
        run: |
          pytest \
            --tb=short \
            -q \
            --continue-on-collection-errors \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=92 \
            --cov-config=.coveragerc

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          retention-days: 14

      - name: Coverage summary comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: backend/coverage.xml
          token:        ${{ secrets.GITHUB_TOKEN }}
          thresholdAll:      0.92
          thresholdNew:      0.00
          thresholdModified: 0.00

# Deploy is handled automatically by Railway's native GitHub integration.
