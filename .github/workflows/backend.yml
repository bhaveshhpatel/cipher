name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Syntax check — pyflakes only, NO pip install of heavy deps
  # -------------------------------------------------------------------------
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes only
        run: pip install pyflakes

      - name: Syntax check
        working-directory: backend
        run: |
          python -m pyflakes .
          echo "All Python files OK"

  # -------------------------------------------------------------------------
  # Job 2: Regression test suite with coverage gate
  # Gate: --cov-fail-under=92 enforced by pytest.
  # -------------------------------------------------------------------------
  regression:
    name: Regression Tests + Coverage Gate
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:              "https://dummy.supabase.co"
      SUPABASE_KEY:              "dummy-supabase-key"
      SUPABASE_SERVICE_KEY:      "dummy-service-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      JWT_SECRET:                "ci-test-jwt-secret-not-used-in-prod"
      SECRET_KEY:                "ci-test-secret-key"
      TRADIER_API_KEY:           "dummy-tradier-key"
      TRADIER_ACCOUNT_ID:        "VA00000000"
      TRADIER_BASE_URL:          "https://sandbox.tradier.com"
      GROQ_API_KEY:              ""
      ALLOWED_ORIGINS:           "http://localhost:3000,http://testserver,http://test"
      ENVIRONMENT:               "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run regression tests
        working-directory: backend
        run: pytest --cov=. --cov-fail-under=92 --tb=short

  # -------------------------------------------------------------------------
  # Job 3: Deploy to Render on push to main (backend changes only)
  # Requires RENDER_DEPLOY_HOOK_URL secret set in GitHub repo settings.
  # To get this URL:
  #   1. Go to your Render service dashboard
  #   2. Settings → Deploy Hook → copy the URL
  #   3. Add it as a GitHub secret named RENDER_DEPLOY_HOOK_URL
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [lint, regression]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash
