name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "railway.toml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "railway.toml"

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check
        working-directory: backend
        run: |
          find . -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files OK"

# Deploy is handled automatically by Railway's native GitHub integration.
# Railway watches this repo, detects changes to backend/** via watchPatterns
# in the root railway.toml, and redeploys without any CLI or token needed.
# To configure: Railway dashboard -> service -> Settings -> Source -> connect GitHub repo
